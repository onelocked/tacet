[all_follow]
flake-parts = "flake-parts"
flake-utils = "flake-utils"
nixpkgs = "nixpkgs"
rust-overlay = "rust-overlay"
systems = "systems"
tack = "tack"

[omit_inputs]
names = ["flake-compat","pre-commit-hooks","treefmt-nix","home-manager","nix-darwin"]

[shorturls]
applefont = "https://devimages-cdn.apple.com/design/resources/download/{path}"
gh = "github:{path}"

[tack]
recomposable = true

[inputs.apple-font-emoji]
frozen = true
group = "fonts"
type = "fixed"
url = "https://github.com/samuelngs/apple-emoji-ttf/releases/download/macos-26-20260613-f1fc560b/AppleColorEmoji-Linux.ttf"

[inputs.cliphist]
group = "general"
type = "fetch"
url = "gh:sentriz/cliphist"

[inputs.cliphist-tui]
group = "general"
type = "fetch"
url = "gh:SHORiN-KiWATA/cliphist-tui"

[inputs.confirm-dialog]
group = "sxyazi"
type = "fetch"
url = "gh:onelocked/confirm-dialog.yazi"

[inputs.disko]
group = "nix"
url = "gh:nix-community/disko"

[inputs.extra-metadata]
group = "sxyazi"
type = "fetch"
url = "gh:boydaihungst/file-extra-metadata.yazi"

[inputs.fuzzy-search]
group = "sxyazi"
type = "fetch"
url = "gh:onelocked/fuzzy-search.yazi"

[inputs.helium-browser]
group = "browser"
url = "gh:amaanq/helium-flake"

[inputs.hjem]
group = "nix"
url = "gh:feel-co/hjem"

[inputs.hypr-plugs]
group = "hypr"
type = "fetch"
url = "gh:hyprwm/hyprland-plugins"

[inputs.hyprland]
group = "hypr"
url = "gh:hyprwm/Hyprland"

[inputs.jellium-desktop]
frozen = true
group = "desktop"
patches = ["https://github.com/andrewrabert/jellium-desktop/pull/717"]
submodules = true
type = "fetch"
url = "gh:andrewrabert/jellium-desktop/14dc0845981cb7c0aef5fa93ff539d927c8f0eb2"

[inputs.lan-mouse]
group = "desktop"
type = "fetch"
url = "gh:feschber/lan-mouse"

[inputs.mangohud]
group = "gaming"
submodules = true
type = "fetch"
url = "gh:flightlessmango/MangoHud"

[inputs.nito]
group = "general"
url = "gh:onelocked/nito"

[inputs.nixos-core]
group = "nix"
url = "gh:manic-systems/nixos-core"

[inputs.nixos-hardware]
group = "nix"
url = "gh:NixOS/nixos-hardware"

[inputs.nixpkgs]
group = "nix"
url = "gh:nixos/nixpkgs/nixos-unstable"

[inputs.no-header-prompt]
group = "sxyazi"
type = "fetch"
url = "gh:onelocked/no-header-prompt.yazi"

[inputs.pkg-install]
frozen = true
group = "gaming"
submodules = true
type = "fetch"
url = "gh:Muggle345/PKGInstall"

[inputs.preservation]
group = "nix"
url = "gh:nix-community/preservation"

[inputs.proton-cachyos]
group = "gaming"
tag = "cachyos-{version}-slr"
type = "fixed"
unpack = "tarball"
url = "https://github.com/CachyOS/proton-cachyos/releases/download/{tag}/proton-cachyos-{version}-slr-x86_64_v3.tar.xz"

[inputs.proton-ge]
group = "gaming"
tag = "GE-Proton{version}"
type = "fixed"
unpack = "tarball"
url = "https://github.com/GloriousEggroll/proton-ge-custom/releases/download/{tag}/{tag}-x86_64.tar.gz"

[inputs.quickshell]
group = "desktop"
url = "gh:quickshell-mirror/quickshell"

[inputs.rclip-sync]
url = "gh:onelocked/rclip-sync"

[inputs.rust-overlay]
url = "gh:oxalica/rust-overlay"

[inputs.scroll-overview]
group = "hypr"
patches = ["https://github.com/yayuuu/hyprland-scroll-overview/pull/83","https://gist.githubusercontent.com/onelocked/45255ba95ff9d552a86751f1ea6ae733/raw/8d833b2f9b039d19eed5f12b82aa70697553773f/scrollview.patch"]
type = "fetch"
url = "gh:yayuuu/hyprland-scroll-overview/new-release"

[inputs.sf-compact]
frozen = true
group = "fonts"
type = "fixed"
url = "applefont:SF-Compact.dmg"

[inputs.sf-mono]
frozen = true
group = "fonts"
type = "fixed"
url = "applefont:SF-Mono.dmg"

[inputs.sf-pro]
frozen = true
group = "fonts"
type = "fixed"
url = "applefont:SF-Pro.dmg"

[inputs.sops-nix]
group = "nix"
url = "gh:Mic92/sops-nix"

[inputs.spicetify-nix]
group = "desktop"
url = "gh:Gerg-L/spicetify-nix"

[inputs.systemctl-tui]
group = "general"
type = "fetch"
url = "gh:rgwood/systemctl-tui"

[inputs.systems]
group = "nix"
url = "gh:nix-systems/default-linux"

[inputs.tack]
group = "nix"
url = "gh:manic-systems/tack"

[inputs.theme-store]
group = "browser"
type = "fetch"
url = "gh:zen-browser/theme-store"

[inputs.tuishell]
group = "desktop"
type = "fetch"
url = "git+https://gitea.onelock.org/onelock/tuishell"

[inputs.yazbar]
group = "sxyazi"
type = "fetch"
url = "gh:onelocked/yazbar.yazi"

[inputs.yazi]
group = "sxyazi"
url = "gh:sxyazi/yazi"

[inputs.yazi-plugins]
group = "sxyazi"
type = "fetch"
url = "gh:AminurAlam/yazi-plugins"

[inputs.zen-browser]
group = "browser"
url = "gh:0xc000022070/zen-browser-flake"

