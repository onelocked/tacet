---
name: package cache
on:
  workflow_dispatch:
jobs:
  prepare-matrix:
    name: Check Cache
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = pipe-operators
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: onelock
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true  # we push tack explicitly, not every path the job touches
      - name: Ensure tack is cached
        run: |
          TACK_PATH=$(nix eval --raw .#tack.outPath)
          HASH=$(basename "$TACK_PATH" | cut -d'-' -f1)
          if curl -s -f -I "https://onelock.cachix.org/$HASH.narinfo" >/dev/null; then
            echo "tack is already cached."
          else
            echo "tack is not cached, building and pushing."
            nix build .#tack --no-link --print-out-paths --print-build-logs | cachix push onelock
          fi
      - name: Filter uncached packages
        id: set-matrix
        run: |
          eval_pkg() {
            local pkg="$1" err out i
            local -A seen=()
            local -a found new
            err="$(mktemp)"
            for _ in $(seq 1 50); do
              if out=$(nix eval --raw ".#packages.x86_64-linux.${pkg}.outPath" 2>"$err"); then
                printf '%s' "$out"
                rm -f "$err"
                return 0
              fi
              mapfile -t found < <(grep -oP "patched tree of '\\K[^']+" "$err" | sort -u)
              new=()
              for i in "${found[@]}"; do
                if [ -z "${seen[$i]:-}" ]; then
                  seen[$i]=1
                  new+=("$i")
                fi
              done
              if [ ${#new[@]} -eq 0 ]; then
                cat "$err" >&2
                rm -f "$err"
                return 1
              fi
              echo "::notice::materializing ${new[*]} (needed by $pkg)" >&2
              nix run .#tack -- materialize "${new[@]}" >&2 || return 1
            done
            echo "::error::too many materialize rounds for $pkg" >&2
            return 1
          }
          readarray -t PACKAGES < <(nix run .#list-remote-packages)
          MISSING=()
          for pkg in "${PACKAGES[@]}"; do
            if STORE_PATH=$(eval_pkg "$pkg"); then
              HASH=$(basename "$STORE_PATH" | cut -d'-' -f1)
              if ! curl -s -f -I "https://onelock.cachix.org/$HASH.narinfo" >/dev/null; then
                MISSING+=("$pkg")
              fi
            else
              echo "::error::Evaluation failed for package: $pkg"
              exit 1
            fi
          done
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "All packages are cached."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            JSON_ARRAY="$(jq -nc '$ARGS.positional' --args "${MISSING[@]}")"
            echo "matrix=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
          fi
  build-packages:
    name: Build ${{ matrix.package }}
    needs: prepare-matrix
    if: >-
      needs.prepare-matrix.result == 'success' &&
      needs.prepare-matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = pipe-operators
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: onelock
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Materialize required tack inputs
        run: |
          pkg="${{ matrix.package }}"
          err="$(mktemp)"
          declare -A seen=()
          for _ in $(seq 1 50); do
            if nix eval --raw ".#packages.x86_64-linux.${pkg}.outPath" >/dev/null 2>"$err"; then
              exit 0
            fi
            mapfile -t found < <(grep -oP "patched tree of '\\K[^']+" "$err" | sort -u)
            new=()
            for i in "${found[@]}"; do
              if [ -z "${seen[$i]:-}" ]; then
                seen[$i]=1
                new+=("$i")
              fi
            done
            if [ ${#new[@]} -eq 0 ]; then
              cat "$err" >&2
              exit 1
            fi
            echo "::notice::materializing ${new[*]}"
            nix run .#tack -- materialize "${new[@]}"
          done
          echo "::error::too many materialize rounds"
          exit 1
      - name: Build ${{ matrix.package }}
        run: nix build ".#packages.x86_64-linux.${{ matrix.package }}" --print-build-logs
      - name: Record Build Status
        if: always()
        run: echo "${{ job.status }}" > "status-${{ matrix.package }}.txt"
      - name: Upload Build Status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-${{ matrix.package }}
          path: status-${{ matrix.package }}.txt
          retention-days: 1
  notify:
    name: Notify Discord
    needs: build-packages
    if: always() && needs.build-packages.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Statuses
        uses: actions/download-artifact@v8
        with:
          pattern: status-*
          merge-multiple: true
      - name: Create Summary
        id: summary
        run: |
          echo "description<<EOF" >> "$GITHUB_OUTPUT"
          for file in status-*.txt; do
            [ -e "$file" ] || continue
            PACKAGE="${file#status-}"
            PACKAGE="${PACKAGE%.txt}"
            if [ "$(cat "$file")" = "success" ]; then
              echo "✅ $PACKAGE" >> "$GITHUB_OUTPUT"
            else
              echo "❌ $PACKAGE" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          username: GitHub Workflow
          avatar_url: ${{ secrets.AVATAR_URL }}
          status: ${{ needs.build-packages.result }}
          title: Build and cache packages
          description: ${{ steps.summary.outputs.description }}
          content: look at this shi ${{ secrets.DISCORD_USER}}
          notimestamp: true
